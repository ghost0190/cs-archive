<style>.terminal {
        --color: black;
        --background: white;
        --link-color: darkblue;
        --size: 1.2;
        --font: "Source Code Pro", monospace;
    }

    .terminal::after {
        content: "";
        background-image: url("bustub.svg");
        opacity: 0.02;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        position: absolute;
        z-index: -1;
        transform: rotate(-30deg);
    }

    table,
    tr,
    td,
    tbody,
    thead,
    div {
        font-size: calc(var(--size, 1)*(12px/var(--pixel-density, 1)));
        white-space: pre;
    }

    .svg-wrapper {
        width: 80%;
        overflow-x: hidden;
        background-color: white;
        border: 1px solid grey;
    }
</style>

<script src="bustub-wasm-bpt-printer.js"></script>

<script type="text/javascript">
    const BUSTUB_PUBLIC_VERSION_VAR = "d4159e3"
    const BUSTUB_PRIVATE_VERSION_VAR = "1ad029e"
    const BUSTUB_BUILD_TIME_VAR = "20250310"
    const viz = new Viz()

    Module['onRuntimeInitialized'] = function () {
        const initialize = Module.cwrap('BusTubInit', 'number', ['number', 'number'])
        const executeQuery = Module.cwrap('BusTubApplyCommand', 'number', ['string', 'number', 'number'])
        window.executeQuery = (x) => {
            const bufferSize = 64 * 1024
            const ptrOutput = Module._malloc(bufferSize)
            Module.stringToUTF8("", ptrOutput, bufferSize)
            const retCode = executeQuery(x, ptrOutput, bufferSize)
            output = Module.UTF8ToString(ptrOutput)
            Module._free(ptrOutput)
            return [retCode, output]
        }
        window.initialize = initialize
    }

    const helpMessage =
        "i <k>  -- 插入 <k>（int64_t）作为键和值。\n" +
        "d <k>  -- 删除键 <k> 及其关联的值。\n"


    function preventScroll(e) {
        e.preventDefault();
        e.stopPropagation();

        return false;
    }

    $(document).ready(() => {
        var initialized = false
        var svgid = 0
        var term = $('body').terminal(function (line) {
            if (line == "\\clear") {
                this.clear()
            } else if (line == "?") {
                this.echo(helpMessage)
            } else {
                if (!window.initialize) {
                    this.echo("BusTub shell 正在初始化，请稍候。")
                } else if (!initialized) {
                    const [x, y] = line.split(" ")
                    const [px, py] = [parseInt(x), parseInt(y)]
                    if (px >= 2 && py >= 3) {
                        initialize(px, py)
                        this.echo(`leaf_max_size=${px}, internal_max_size=${py}`)
                        initialized = true
                    }
                } else {
                    const [retCode, result] = executeQuery(line)
                    if (retCode == 0) {
                        viz.renderSVGElement(result).then((svgXml) => {
                            id = `bustub-svg-${svgid}`
                            svgXml.id = id
                            svgid += 1
                            const div = document.createElement("div")
                            div.className = "svg-wrapper"
                            div.appendChild(svgXml)
                            this.echo(div, { raw: true })
                            svgPanZoom(`#${id}`)
                            $(`#${id}`).width("100%")
                            document.querySelector(`#${id}`).addEventListener('wheel', preventScroll, { passive: false });
                            this.echo("")
                        })
                    }
                    if (retCode == 1) {
                        this.echo("出错了。")
                    }
                    if (retCode == 2) {
                        this.echo("由于输出限制，输出被截断。")
                    }
                }
            }
        }, {
            greetings: `[[@;;;;bustub.svg]]`,
            prompt: () => initialized ? "[[b;;]printer> ]" : "leaf_max_size 和 internal_max_size？（例如 3 3）"
        })
        term.echo(`<hr><h1>BusTub B+树可视化器</h1>`, { raw: true })
        term.echo(`
[[b;;]解决方案版本:] ${BUSTUB_PRIVATE_VERSION_VAR} . [[b;;]BusTub 版本:] ${BUSTUB_PUBLIC_VERSION_VAR} . [[b;;]构建日期:] ${BUSTUB_BUILD_TIME_VAR}

BusTub 是卡内基梅隆大学为数据库系统导论（15-445/645）课程构建的关系数据库管理系统。该系统仅供教学使用，不应在生产环境中使用。&#91;[[!;;;;https://github.com/cmu-db/bustub]BusTub GitHub]&#93; &#91;[[!;;;;https://15445.courses.cs.cmu.edu/]课程网站]&#93; &#91;[[!;;;;https://github.com/cmu-db/bustub/issues/new]报告错误]&#93;

${helpMessage}
`)
    })
</script>
