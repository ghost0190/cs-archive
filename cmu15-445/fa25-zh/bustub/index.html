<style>.terminal {
        --color: black;
        --background: white;
        --link-color: darkblue;
        --size: 1.2;
        --font: "Source Code Pro", monospace;
    }

    .terminal::after {
        content: "";
        background-image: url("bustub.svg");
        opacity: 0.02;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        position: absolute;
        z-index: -1;
        transform: rotate(-30deg);
    }

    table,
    tr,

        white-space: pre;
    }
</style>

<script src="bustub-wasm-shell.js"></script>

<script type="text/javascript">
    const BUSTUB_PUBLIC_VERSION_VAR = "deee24f"
    const BUSTUB_PRIVATE_VERSION_VAR = "6007710"
    const BUSTUB_BUILD_TIME_VAR = "20251022"
    let is_ready = false

    Module['onRuntimeInitialized'] = function () {
        const executeQuery = Module.cwrap('BusTubExecuteQuery', 'number', ['string', 'number', 'number', 'number'])
        const initialize = Module.cwrap('BusTubInit', 'number', [])
        window.executeQuery = (x) => {
            const bufferSize = 64 * 1024
            const ptrOutput = Module._malloc(bufferSize)
            Module.stringToUTF8("", ptrOutput, bufferSize)
            const ptrOutput2 = Module._malloc(bufferSize)
            Module.stringToUTF8("", ptrOutput2, bufferSize)
            const retCode = executeQuery(x, ptrOutput2, ptrOutput, bufferSize)
            output = Module.UTF8ToString(ptrOutput)
            output2 = Module.UTF8ToString(ptrOutput2)
            Module._free(ptrOutput)
            Module._free(ptrOutput2)
            return [retCode, output2, output]
        }
        initialize()
        is_ready = true
    }

    $(document).ready(() => {
        $.terminal.syntax('sql')
        $.terminal.prism_formatters = {
            prompt: false,
            echo: false,
            animation: false,
            command: true
        }
        let line = ""
        let bustub_prompt = ""
        var term = $('body').terminal(function (command) {
            if (!is_ready) {
                this.echo("BusTub shell 正在初始化，请稍候。")
                return
            }
            line += command
            if (line.endsWith(';') || line.startsWith("\\")) {
                if (line == "\\clear") {
                    this.clear()
                } else {
                    const [retCode, new_prompt, result] = executeQuery(line)
                    bustub_prompt = new_prompt
                    console.log(bustub_prompt)
                    this.echo(result, { raw: true })
                    if (retCode == 1) {
                        this.echo("由于输出限制，表格被截断。")
                    }
                    this.echo()
                }
                line = ""
            }
        }, {
            greetings: `[[@;;;;bustub.svg]]`,
            prompt: () => line.length == 0 ? "[[b;;]" + (bustub_prompt.length == 0 ? "bustub" : bustub_prompt) + "> ]" : "[[b;;]... ]"
        })
        term.echo(`<hr><h1>实时数据库命令行</h1>`, { raw: true })

        term.echo(`
[[b;;]解决方案版本:] ${BUSTUB_PRIVATE_VERSION_VAR} . [[b;;]BusTub 版本:] ${BUSTUB_PUBLIC_VERSION_VAR} . [[b;;]构建日期:] ${BUSTUB_BUILD_TIME_VAR}

BusTub 是卡内基梅隆大学为数据库系统导论（15-445/645）课程构建的关系数据库管理系统。该系统仅供教学使用，不应在生产环境中使用。&#91;[[!;;;;https://github.com/cmu-db/bustub]BusTub GitHub]&#93; &#91;[[!;;;;https://15445.courses.cs.cmu.edu/]课程网站]&#93; &#91;[[!;;;;https://github.com/cmu-db/bustub/issues/new]报告错误]&#93;

使用 \\help 查看帮助。使用 \\clear 清除页面。

这是运行在您浏览器中的 BusTub 参考解决方案！
`)
    })
</script>
