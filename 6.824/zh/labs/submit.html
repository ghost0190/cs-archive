<h3>提交流程</h3>

<p>
提交前，请最后运行一次所有测试。
</p>

<p>
使用 <tt>make lab<i>n</i><i>p</i></tt> 命令打包你的实验作业，并将生成的压缩包 <tt>lab<i>n</i><i>p</i>-handin.tar.gz</tt> 上传到 <a href="https://www.gradescope.com/courses/974763">Gradescope</a>。
<i>n</i> 是实验编号（即 1、2、3 或 4），<i>p</i> 是部分编号（例如 A、B 或 C），如果实验分为多个部分的话。

<p>例如：
<pre>
$ cd ~/6.5840
$ make lab1
</pre>

或者：
<pre>
$ cd ~/6.5840
$ make lab3a
</pre>


<p>在提交后续部分之前，确保之前的部分仍然能正常工作。即运行所有测试直到你要提交的部分。
</p>

<p class="note">
你可以提交多次。我们将使用你<strong>最后一次</strong>提交的时间戳来计算迟交天数。

</p>

</body>
