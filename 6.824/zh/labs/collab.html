<h3>协作政策</h3>
<p>
你必须自己编写所有提交给 6.5840 的代码，作业中我们提供的代码除外。你不可以
查看任何其他同学的解答，也不可以查看往年 6.5840 或 6.824 的解答。你可以与其他
同学讨论作业，但不可以查看或复制彼此的代码。这条规则的原因是，我们相信你自己
设计和实现实验解答能学到最多。

<p>
请不要公开你的代码，也不要让当前或未来的 6.5840 学生获取到。
<tt>github.com</tt> 上的仓库默认是公开的，所以请不要把代码放在上面，除非你将仓库设为私有。你可以使用
<a href="https://github.mit.edu/">MIT 的 GitHub</a>，
但请确保创建私有仓库。

</body>
