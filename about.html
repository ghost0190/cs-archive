<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 - CS Archive</title>
  <meta name="description" content="CS Archive 的归档说明。">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="index.html"><img src="favicon.svg" alt=""><span>CS Archive</span></a>
      <div class="links">
        <a href="index.html">首页</a>
        <a href="courses.html">课程</a>
        <a href="about.html" aria-current="page">关于</a>
      </div>
    </nav>
  </header>

  <main class="narrow-shell">
    <section class="page-head">
      <p class="eyebrow">About</p>
      <h1>关于 CS Archive</h1>
      <p class="lead">这个站点收录经典计算机课程的中英文归档版本，并在入口层补充课程定位、学习路径和资源目录。</p>
    </section>

    <section class="section">
      <div class="path-grid">
        <article class="note-card">
          <h3>保持原貌</h3>
          <p>课程原站页面尽量保留原有结构与资源链接，方便回到课程当时的上下文。</p>
        </article>
        <article class="note-card">
          <h3>降低入口噪音</h3>
          <p>根目录页面只做导航，不复刻课程站内容；深入内容交给独立课程主页。</p>
        </article>
        <article class="note-card">
          <h3>服务自学</h3>
          <p>中文整理版和英文原站并列，便于对照阅读，也便于按主题选择学习顺序。</p>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer">CS Archive 仅用于课程资料整理与自学导航。</footer>
</body>
</html>
