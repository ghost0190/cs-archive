name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 805b33dabc3ee15b816e1b591928951e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not configured; skipping deployment."

      - name: Set up Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare and validate site
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm run build:pages
          npm run validate:pages

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@4.110.0 pages deploy dist --project-name=cs-archive --branch=main
